name: Validate personal configuration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pyyaml
      - run: python -m compileall -q src scripts
      - run: python -m pytest -q tests/test_obtainium.py tests/test_version_mismatch.py tests/test_direct.py
      - run: python -m pytest -q tests/test_personal_updates.py
