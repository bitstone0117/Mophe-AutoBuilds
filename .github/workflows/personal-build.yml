name: Personal FB IG YouTube
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Build all apps or test one app (single-app tests do not publish)'
        type: choice
        default: all
        options:
          - all
          - youtube
          - instagram
          - facebook
          - discord
  schedule:
    # 08:17 Taipei, with a 12:17 catch-up check if GitHub drops/delays a run.
    # Both runs compare the last published state; unchanged sources never build.
    - cron: '17 0,4 * * *'
permissions:
  contents: read
concurrency:
  group: personal-build
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.detect.outputs.has_updates }}
      state_b64: ${{ steps.detect.outputs.state_b64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check upstream patch updates
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_personal_updates.py

  build:
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check.outputs.has_updates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: >-
        ${{ fromJSON(
          (github.event_name == 'schedule' || inputs.app == 'all') &&
          '{"include":[{"app":"youtube","source":"morphe"},{"app":"instagram","source":"hushgram"},{"app":"facebook","source":"hushfacebook"},{"app":"discord","source":"venus"}]}' ||
          (inputs.app == 'youtube' && '{"include":[{"app":"youtube","source":"morphe"}]}') ||
          (inputs.app == 'instagram' && '{"include":[{"app":"instagram","source":"hushgram"}]}') ||
          (inputs.app == 'discord' && '{"include":[{"app":"discord","source":"venus"}]}') ||
          '{"include":[{"app":"facebook","source":"hushfacebook"}]}'
        ) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure KEYSTORE_BASE64 first'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          test -s "$RUNNER_TEMP/signing.p12"
      - name: Install build dependencies
        run: |
          pip install -r requirements.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build and verify selected application
        env:
          APP_NAME: ${{ matrix.app }}
          SOURCE: ${{ matrix.source }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          SIGNING_KEYSTORE: ${{ runner.temp }}/signing.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ "$APP_NAME" = instagram ] && [ -z "$GPLAYDL_API_KEY" ]; then
            echo "::error::Configure GPLAYDL_API_KEY in repository Actions secrets to enable Google Play downloads."
            exit 1
          fi
          python -m src
          python scripts/collect_personal_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.app }}
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing key and Google Play tokens
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -f "$HOME/.config/gplaydl"/auth-*.json
  publish:
    if: ${{ success() && needs.check.result == 'success' && needs.build.result == 'success' && (github.event_name == 'schedule' || inputs.app == 'all') }}
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-apks
          merge-multiple: true
      - name: Publish complete build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_B64: ${{ needs.check.outputs.state_b64 }}
        run: |
          test "$(find release-apks -name '*.apk' | wc -l)" -eq 4
          python scripts/personal_obtainium.py
          printf '%s' "$STATE_B64" | base64 --decode > release-apks/source-state.json
          python scripts/check_personal_updates.py --verify-state release-apks/source-state.json
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
          bash ../scripts/publish_personal_release.sh
