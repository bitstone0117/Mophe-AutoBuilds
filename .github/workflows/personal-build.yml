name: Personal FB IG YouTube
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Build all apps or test one app (single-app tests do not publish)'
        type: choice
        default: all
        options:
          - all
          - youtube
          - instagram
          - facebook
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
concurrency:
  group: personal-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON((github.event_name == 'schedule' || inputs.app == 'all') && '{"include":[{"app":"youtube","source":"morphe"},{"app":"instagram","source":"hushgram"},{"app":"facebook","source":"hushfacebook"}]}' || inputs.app == 'youtube' && '{"include":[{"app":"youtube","source":"morphe"}]}' || inputs.app == 'instagram' && '{"include":[{"app":"instagram","source":"hushgram"}]}' || '{"include":[{"app":"facebook","source":"hushfacebook"}]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure KEYSTORE_BASE64 first'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          test -s "$RUNNER_TEMP/signing.p12"
      - name: Install build dependencies
        run: |
          pip install -r requirements.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build and verify selected application
        env:
          APP_NAME: ${{ matrix.app }}
          SOURCE: ${{ matrix.source }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          SIGNING_KEYSTORE: ${{ runner.temp }}/signing.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ "$APP_NAME" = instagram ] && [ -z "$GPLAYDL_API_KEY" ]; then
            echo "::error::Configure GPLAYDL_API_KEY in repository Actions secrets to enable Google Play downloads."
            exit 1
          fi
          python -m src
          python scripts/collect_personal_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.app }}
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing key and Google Play tokens
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -f "$HOME/.config/gplaydl"/auth-*.json
  publish:
    if: github.event_name == 'schedule' || inputs.app == 'all'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-apks
          merge-multiple: true
      - name: Publish complete build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(find release-apks -name '*.apk' | wc -l)" -eq 3
          python scripts/personal_obtainium.py
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" *.apk SHA256SUMS.txt obtainium.json --title "Personal build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --notes 'YouTube (Morphe), Instagram (HushGram), Facebook (HushFacebook). All selected builds and APK signature verification passed. Device installation is not yet verified.' --latest
